<!-- BARRE MOBILE -->
    <div class="mobile-bar" id="mobile-bar">
      <button class="hamburger" id="hamburger-btn" aria-label="Menu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <span class="mobile-title" id="mobile-title">Marexcode</span>
      <button class="mobile-new" id="mobile-new-btn" aria-label="Nouvelle conversation">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <button class="sb-close" id="sb-close-btn" aria-label="Fermer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="sb-scroll">

        <button class="sb-back-btn" id="sb-back-btn">
          <img src="/images/Cetas42.png" alt="" width="18" height="18" style="border-radius:4px">
          Retour à Cetas
        </button>

        <button class="new-session-btn" id="new-session-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Nouvelle conversation
        </button>

        <button class="sb-row" data-item="recherche">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          Rechercher des conversations
        </button>

        <div class="sb-divider"></div>

        <div class="sb-group-label">Projets</div>
        <button class="sb-section-toggle" id="toggle-workspace">
          <span>Projet actif</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sb-collapsible" id="panel-workspace">
          <div class="sb-project-header" id="sb-project-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
            <span id="sb-project-header-name">Marexcode (serveur)</span>
          </div>
          <div class="sb-tree-empty" id="workspace-empty">Chargement…</div>
          <div id="workspace-tree"></div>
        </div>

        <button class="sb-section-toggle" id="toggle-workspaces">
          <span>Mes projets</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sb-collapsible" id="panel-workspaces">
          <div class="sb-tree-empty" id="workspaces-empty">Aucun projet importé.</div>
          <div id="workspaces-list"></div>
          <button id="btn-new-workspace" class="sb-new-project-btn">+ Nouveau projet</button>
        </div>

        <div class="sb-divider"></div>
        <div class="sb-group-label">Discussions</div>
        <button class="sb-section-toggle" id="toggle-history">
          <span>Toutes les discussions</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sb-collapsible" id="panel-history">
          <div class="sb-tree-empty" id="sessions-empty">Aucune discussion.</div>
          <div id="sessions-list"></div>
        </div>

        <div class="sb-divider"></div>
        <div class="sb-group-label">Metriques</div>
        <div id="sb-metrics" class="sb-metrics">
          <div class="sb-metric-row" id="metric-cpu"><span class="sb-metric-label">CPU</span><div class="sb-metric-bar"><div class="sb-metric-fill" id="metric-cpu-fill" style="width:0%"></div></div><span class="sb-metric-value" id="metric-cpu-val">—</span></div>
          <div class="sb-metric-row" id="metric-ram"><span class="sb-metric-label">RAM</span><div class="sb-metric-bar"><div class="sb-metric-fill" id="metric-ram-fill" style="width:0%"></div></div><span class="sb-metric-value" id="metric-ram-val">—</span></div>
          <div class="sb-metric-row" id="metric-disk"><span class="sb-metric-label">Disk</span><div class="sb-metric-bar"><div class="sb-metric-fill" id="metric-disk-fill" style="width:0%"></div></div><span class="sb-metric-value" id="metric-disk-val">—</span></div>
          <div id="metric-vram-list"></div>
        </div>

      </div>

      <div class="sb-user-wrap" id="user-wrap">
        <div class="sb-user-menu" id="user-menu">
          <div class="sb-user-menu-email" id="user-menu-email">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>
            <span id="user-email-text"></span>
          </div>
          <button class="sb-user-menu-item" id="open-settings">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Paramètres
          </button>
          <button class="sb-user-menu-item" id="btn-archived-chats">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8"/><path d="M10 13h4"/></svg>
            Discussions archivées
          </button>
          <button class="sb-user-menu-item" id="btn-suggestions">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            Suggestions
          </button>
          <div class="sb-user-menu-divider"></div>
          <button class="sb-user-menu-item danger" id="logout-btn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Se déconnecter
          </button>
        </div>

        <button class="sb-user-btn" id="user-btn">
          <span class="sb-avatar" id="user-avatar">M</span>
          <span id="user-name">Utilisateur</span>
        </button>
      </div>
    </div>
