<!-- ============ PAGE PROFIL ============ -->
<div class="frame" id="profile-frame" style="display:none;">
  <div class="app">
    <div class="profile-view">

      <div class="profile-header">
        <button class="settings-back" id="profile-back-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          Retour
        </button>
      </div>

      <div class="profile-content">

        <!-- Avatar + User Info -->
        <div class="profile-user-card">
          <div class="profile-avatar" id="profile-avatar">S</div>
          <div class="profile-user-info">
            <h2 id="profile-username">—</h2>
            <p class="profile-role" id="profile-role">admin</p>
            <p class="profile-email" id="profile-email">—</p>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="profile-stats-grid">
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="stat-tokens">—</div>
            <div class="profile-stat-label">Total tokens</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="stat-chats">—</div>
            <div class="profile-stat-label">Total chats</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="stat-streak">—</div>
            <div class="profile-stat-label">Série active</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="stat-model">—</div>
            <div class="profile-stat-label">Modèle favori</div>
          </div>
        </div>

        <!-- Heatmap -->
        <div class="profile-section">
          <h3>Activité (30 derniers jours)</h3>
          <div class="profile-heatmap-wrap">
            <canvas id="profile-heatmap" width="680" height="110"></canvas>
          </div>
          <div class="profile-heatmap-legend">
            <span>Moins</span>
            <div class="profile-heatmap-box" style="background:#16161b"></div>
            <div class="profile-heatmap-box" style="background:#1a472a"></div>
            <div class="profile-heatmap-box" style="background:#238636"></div>
            <div class="profile-heatmap-box" style="background:#26a641"></div>
            <span>Plus</span>
          </div>
        </div>

        <!-- Activity Overview -->
        <div class="profile-section">
          <h3>Aperçu activité</h3>
          <div class="profile-card">
            <div class="profile-overview-row">
              <span class="profile-overview-label">Mode rapide</span>
              <span class="profile-overview-value" id="ov-mode">—</span>
            </div>
            <div class="profile-overview-row">
              <span class="profile-overview-label">Raisonnement utilisé</span>
              <span class="profile-overview-value" id="ov-reasoning">—</span>
            </div>
            <div class="profile-overview-row">
              <span class="profile-overview-label">Compétences actives</span>
              <span class="profile-overview-value" id="ov-skills">—</span>
            </div>
            <div class="profile-overview-row">
              <span class="profile-overview-label">Total chats</span>
              <span class="profile-overview-value" id="ov-chats">—</span>
            </div>
          </div>
        </div>

        <!-- Top Skills -->
        <div class="profile-section">
          <h3>Skills les plus utilisés</h3>
          <div class="profile-card" id="profile-top-skills">
            <div style="color:var(--text-secondary);font-size:13px;">Chargement...</div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
