    <script>
    // Auto-fill username depuis localStorage + autofocus password
    (function() {
        try {
            var user = JSON.parse(localStorage.getItem('cetas-user'));
            if (user && user.username) {
                var input = document.getElementById('login-username');
                if (input) input.value = user.username;
            }
        } catch(e) {}
        // Autofocus password si username déjà rempli
        setTimeout(function() {
            var u = document.getElementById('login-username');
            var p = document.getElementById('login-password');
            if (u && u.value && p) p.focus();
        }, 100);
        // Forgot password
        var fg = document.getElementById('login-forgot');
        if (fg) fg.addEventListener('click', function(e) {
            e.preventDefault();
            alert('Pour réinitialiser votre mot de passe :\n\n1. Serveur : demandez à l\'administrateur\n2. Desktop : supprimez %APPDATA%\\Cetas\\data\\users.json et recréez le compte');
        });
    })();
    </script>
