server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de sécurité (HSTS géré par Caddy, CSP dans index.html)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Gzip compression — divise le poids par ~5
    gzip on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript text/html application/json image/svg+xml text/plain;
    gzip_vary on;

    # Bloquer l'accès aux fichiers/dossiers cachés (.vault, .env, etc.)
    location ~ /\. { deny all; return 404; }

    # Fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache court sur les assets (JS/CSS/images)
    # Pas de cache agressif — l'app est en Single Page, les fichiers
    # changent à chaque déploiement.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Proxy SearXNG (recherche web auto-hébergée)
    location /search {
        proxy_pass http://searxng:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    # Proxy DuckDuckGo HTML (fallback recherche, contourne CORS navigateur)
    location /ddg-proxy/ {
        limit_req zone=ddgproxy burst=5 nodelay;
        proxy_ssl_server_name on;
        proxy_pass https://html.duckduckgo.com/;
        proxy_set_header Host html.duckduckgo.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Proxy API → backend Python
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }
}
