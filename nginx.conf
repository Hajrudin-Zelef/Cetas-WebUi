server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — divise le poids par ~5
    gzip on;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/javascript text/html application/json image/svg+xml text/plain;
    gzip_vary on;

    # Fichiers statiques
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache court sur les assets (JS/CSS/images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Proxy API → backend Python
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }
}
