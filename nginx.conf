server {
    listen 80;
    root /usr/share/nginx/html/static;
    index index.html;
    ssi on;

    # Sécurité
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Gzip — max compression
    gzip on;
    gzip_comp_level 9;
    gzip_min_length 128;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml font/woff2;

    # Bloquer fichiers cachés
    location ~ /\. { deny all; return 404; }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets statiques — no-cache en dev (revalidate via ?v=X)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Proxy SearXNG
    location /search {
        proxy_pass http://searxng:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Proxy API → backend Python
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Marge au-dessus de la limite backend (20 Mo) pour l'upload de
        # dossier Marexcode (/api/marexcode/upload), sans quoi nginx
        # rejette en 413 avant même d'atteindre le code Python.
        client_max_body_size 25m;

        proxy_buffering off;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
        proxy_cache off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection 'keep-alive';
        proxy_set_header Keep-Alive 'timeout=600';
        chunked_transfer_encoding on;
        
        # SSE/Streaming support
        proxy_set_header X-Accel-Buffering no;
    }

}
